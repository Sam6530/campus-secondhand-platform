<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园循环 · 交易流程原型</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="mark">循</span><div><strong>校园循环</strong><small>让闲置物品，遇见下一位同学</small></div></div><label>模拟身份 <select id="actor"><option value="buyer">买方甲</option><option value="buyer2">买方乙</option><option value="seller">卖方</option><option value="admin">管理员</option><option value="guest">访问者</option><option value="unverified">未认证用户</option></select></label></header>
<div class="notice">需求验证原型 · 数据仅保存在本页内存，刷新或重置将清空。角色切换不是真实登录，通知与线下交付均为模拟。</div>
<main><nav aria-label="主导航"><button data-tab="market" class="active">发现物品</button><button data-tab="orders">我的订单</button><button data-tab="manage">管理台</button></nav><div id="feedback" role="status" aria-live="polite">准备好了。从一笔交易开始验证。</div><section id="content"></section>
<details id="lab"><summary>验证工具与模拟设置</summary><p>此面板仅供走查：改变身份、故障条件和请求标识，观察同一需求在不同条件下的结果。这里的状态观察不代表真实后台能力。</p><div class="lab-grid"><label>操作标识 <input id="intent" value="C-001"></label><button id="newIntent">生成新操作标识</button><label>提交情境 <select id="mode"><option value="normal">正常响应</option><option value="lost">业务成功但响应丢失</option><option value="pending">暂缓处理</option></select></label><label class="check"><input type="checkbox" id="notifyFail"> 模拟通知发送失败</label><button id="finish">处理所有挂起请求</button><button id="export">导出本次走查记录</button><button id="reset" class="danger">重置模拟数据</button></div><p id="stateSummary"></p><pre id="trace" aria-label="最近操作记录"></pre></details>
<footer>核心范围：下单、交付与确认、取消、履约争议、账户限制。发布审核、真实支付、后台并发与性能不在本次实现范围。</footer></main>
<dialog id="actionDialog"><form id="actionForm"><h2 id="dialogTitle"></h2><p id="dialogHelp"></p><label id="reasonLabel">原因或说明<textarea id="reason" rows="3" placeholder="请填写本次操作的真实情境（演示请注明模拟）"></textarea></label><label class="check" id="declarationLabel"><input type="checkbox" id="declaration"><span id="declarationText"></span></label><label id="outcomeLabel">处置方式<select id="outcome"><option value="continue">继续履约，恢复原阶段</option><option value="terminate">经核查异常终止</option></select></label><label class="check" id="evidenceLabel"><input type="checkbox" id="evidence"> 已记录无法履约的核查依据（模拟，不代表真实核查）</label><label class="check" id="deliveredLabel"><input type="checkbox" id="delivered"> 已实际交付但存在分歧（模拟）</label><div class="dialog-actions"><button type="button" id="back">返回</button><button class="primary" type="submit">确认提交</button></div></form></dialog>
<script src="core.js"></script><script src="ui.js"></script></body></html>
