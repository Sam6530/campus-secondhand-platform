<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1960" viewBox="0 0 1500 1960"><rect width="100%" height="100%" fill="white"/><polyline points="410,110 410,1930" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="10 7"/><polyline points="780,110 780,1930" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="10 7"/><polyline points="1150,110 1150,1930" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="10 7"/><rect x="40" y="40" width="360" height="65" rx="12" fill="#E2E8F0" stroke="#334155" stroke-width="3"/><text x="220" y="81" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="26" fill="#111827">买方</text><rect x="410" y="40" width="360" height="65" rx="12" fill="#E2E8F0" stroke="#334155" stroke-width="3"/><text x="590" y="81" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="26" fill="#111827">卖方</text><rect x="780" y="40" width="360" height="65" rx="12" fill="#E2E8F0" stroke="#334155" stroke-width="3"/><text x="960" y="81" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="26" fill="#111827">管理员</text><rect x="1150" y="40" width="350" height="65" rx="12" fill="#E2E8F0" stroke="#334155" stroke-width="3"/><text x="1325" y="81" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="26" fill="#111827">系统（物品／订单）</text><rect x="1160" y="130" width="310" height="105" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="1315" y="175" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">异常入口：取消、催办</text><text x="1315" y="203" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">或交付分歧请求</text><rect x="1160" y="265" width="310" height="105" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="1315" y="310" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">核验身份、归属与阶段</text><text x="1315" y="338" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（BR09、10、14）</text><polygon points="1315,400 1480,475 1315,550 1150,475" fill="#EEF2F7" stroke="#334155" stroke-width="3"/><text x="1315" y="469" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">已有登记、已报告</text><text x="1315" y="495" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">交付或争议受理？</text><rect x="430" y="580" width="310" height="100" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="585" y="623" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">当事人（买／卖任一方）</text><text x="585" y="651" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">声明未交付、提交原因</text><rect x="1160" y="690" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="1315" y="738" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">订单→已取消，释放占用</text><text x="1315" y="766" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（ST-B-16／18）</text><rect x="1160" y="830" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="1315" y="864" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">重检审核、隐藏、撤下、成交</text><text x="1315" y="892" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">与卖方资格；满足→在售</text><text x="1315" y="920" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（ST-B-09），否则不可交易</text><circle cx="1315" cy="975" r="18" fill="white" stroke="#334155" stroke-width="3"/><circle cx="1315" cy="975" r="13" fill="#334155"/><text x="1345" y="982" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#475569">结束</text><rect x="800" y="720" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="955" y="754" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">当事人提出后受理：</text><text x="955" y="782" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">记录理由与证据，保留</text><text x="955" y="810" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">阶段及占用（BR15）</text><rect x="800" y="860" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="955" y="908" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">核查交付、补证与</text><text x="955" y="936" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">关联举报（BR15、16）</text><polygon points="955,995 1105,1070 955,1145 805,1070" fill="#EEF2F7" stroke="#334155" stroke-width="3"/><text x="955" y="1077" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">能否继续履约？</text><rect x="430" y="1170" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="585" y="1218" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">卖方补登记交付</text><text x="585" y="1246" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（ST-B-17）</text><rect x="60" y="1310" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="215" y="1358" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">买方本人确认收到</text><text x="215" y="1386" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（ST-B-19）</text><rect x="1160" y="1310" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="1315" y="1358" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">订单→已完成；</text><text x="1315" y="1386" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">物品→已成交（ST-B-19）</text><circle cx="1315" cy="1450" r="18" fill="white" stroke="#334155" stroke-width="3"/><circle cx="1315" cy="1450" r="13" fill="#334155"/><text x="1345" y="1457" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#475569">结束</text><rect x="800" y="1170" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="955" y="1218" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">记录依据并异常终止</text><text x="955" y="1246" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（BR19）</text><rect x="1160" y="1490" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="1315" y="1524" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">订单→已异常终止，</text><text x="1315" y="1552" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">释放占用；物品仍不可售</text><text x="1315" y="1580" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（ST-B-21）</text><rect x="430" y="1630" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="585" y="1678" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">核实归属后退还或</text><text x="585" y="1706" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">显式重发（BR19）</text><rect x="1160" y="1770" width="310" height="110" rx="12" fill="#E8F0FE" stroke="#334155" stroke-width="3"/><text x="1315" y="1818" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">物品→待审，重新审核</text><text x="1315" y="1846" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（ST-B-12）</text><circle cx="1315" cy="1918" r="18" fill="white" stroke="#334155" stroke-width="3"/><circle cx="1315" cy="1918" r="13" fill="#334155"/><text x="1345" y="1925" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#475569">结束</text><polyline points="1315,235 1315,265" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1315,265 1308,250 1321,250" fill="#334155"/><polyline points="1315,370 1315,400" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1315,400 1308,385 1321,385" fill="#334155"/><polyline points="1315,550 1315,620 740,620" fill="none" stroke="#334155" stroke-width="3"/><polygon points="740,620 754,613 754,626" fill="#334155"/><text x="1332" y="587" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">否</text><polyline points="1150,475 955,475 955,720" fill="none" stroke="#334155" stroke-width="3"/><polygon points="955,720 948,705 961,705" fill="#334155"/><text x="1000" y="459" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">是</text><polyline points="585,680 585,700 1160,700" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1160,700 1145,706 1145,693" fill="#334155"/><polyline points="1315,800 1315,830" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1315,830 1308,815 1321,815" fill="#334155"/><polyline points="1315,940 1315,957" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1315,957 1308,942 1321,942" fill="#334155"/><polyline points="955,830 955,860" fill="none" stroke="#334155" stroke-width="3"/><polygon points="955,860 948,845 961,845" fill="#334155"/><polyline points="955,970 955,995" fill="none" stroke="#334155" stroke-width="3"/><polygon points="955,995 948,980 961,980" fill="#334155"/><polyline points="805,1070 585,1070 585,1170" fill="none" stroke="#334155" stroke-width="3"/><polygon points="585,1170 578,1155 591,1155" fill="#334155"/><text x="700" y="1053" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">是</text><polyline points="955,1145 955,1170" fill="none" stroke="#334155" stroke-width="3"/><polygon points="955,1170 948,1155 961,1155" fill="#334155"/><text x="975" y="1165" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">否</text><polyline points="585,1280 585,1340 370,1340" fill="none" stroke="#334155" stroke-width="3"/><polygon points="370,1340 384,1333 384,1346" fill="#334155"/><polyline points="370,1390 1160,1390" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1160,1390 1145,1396 1145,1383" fill="#334155"/><polyline points="1315,1420 1315,1432" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1315,1432 1308,1417 1321,1417" fill="#334155"/><polyline points="900,1280 900,1550 1160,1550" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1160,1550 1145,1556 1145,1543" fill="#334155"/><polyline points="1315,1600 1315,1620 585,1620 585,1630" fill="none" stroke="#334155" stroke-width="3"/><polygon points="585,1630 578,1615 591,1615" fill="#334155"/><polyline points="585,1740 585,1770 1160,1770" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1160,1770 1145,1776 1145,1763" fill="#334155"/><polyline points="1315,1880 1315,1900" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1315,1900 1308,1885 1321,1885" fill="#334155"/><rect x="60" y="160" width="310" height="260" rx="12" fill="#FFF8DC" stroke="#B45309" stroke-width="3"/><text x="215" y="199" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">并行治理</text><text x="78" y="234" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">限制账户：拒绝新下单、</text><text x="78" y="263" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">新发布（BR12）；保留</text><text x="78" y="292" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">旧单必要权利。</text><text x="78" y="321" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">解封后仍须重检隐藏、</text><text x="78" y="350" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">撤下与成交状态</text><text x="78" y="379" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">（BR03、BR13）。</text></svg>