1" stroke="#334155" stroke-width="2"/><rect x="744" y="330" width="12" height="395" fill="#CBD5E1" stroke="#334155" stroke-width="2"/><rect x="1014" y="780" width="12" height="315" fill="#CBD5E1" stroke="#334155" stroke-width="2"/><rect x="1294" y="480" width="12" height="685" fill="#CBD5E1" stroke="#334155" stroke-width="2"/><polyline points="170,250 470,250" fill="none" stroke="#334155" stroke-width="3"/><polygon points="470,250 456,256 456,243" fill="#334155"/><text x="320" y="232" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">提交下单意图（物品、价格）</text><polyline points="470,330 750,330" fill="none" stroke="#334155" stroke-width="3"/><polygon points="750,330 736,336 736,323" fill="#334155"/><text x="610" y="312" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">核验身份与归属（BR14）</text><polyline points="750,400 470,400" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7"/><polygon points="470,400 483,393 483,406" fill="#334155"/><text x="610" y="382" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">有效／无权（拒绝）</text><polyline points="470,480 1300,480" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1300,480 1286,486 1286,473" fill="#334155"/><text x="885" y="462" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">识别同次操作（BR10）</text><polyline points="1300,550 470,550" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7"/><polygon points="470,550 483,543 483,556" fill="#334155"/><text x="885" y="532" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">原回执／处理中／无记录</text><polyline points="470,630 750,630" fill="none" stroke="#334155" stroke-width="3"/><polygon points="750,630 736,636 736,623" fill="#334155"/><text x="610" y="612" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">检查双方新交易资格（BR06、BR12）</text><polyline points="750,700 470,700" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7"/><polygon points="470,700 483,693 483,706" fill="#334155"/><text x="610" y="682" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">允许／拒绝</text><polyline points="470,780 1020,780" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1020,780 1006,786 1006,773" fill="#334155"/><text x="745" y="762" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">校验公开可交易（BR03）</text><polyline points="1020,850 470,850" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7"/><polygon points="470,850 483,843 483,856" fill="#334155"/><text x="745" y="832" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">可交易／竞争失败</text><polyline points="470,930 1300,930" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1300,930 1286,936 1286,923" fill="#334155"/><text x="885" y="912" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">建立订单并保存快照（BR20）</text><polyline points="1300,1000 1020,1000" fill="none" stroke="#334155" stroke-width="3"/><polygon points="1020,1000 1033,993 1033,1006" fill="#334155"/><text x="1160" y="982" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">预占物品（BR06）</text><polyline points="1020,1070 1300,1070" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7"/><polygon points="1300,1070 1286,1076 1286,1063" fill="#334155"/><text x="1160" y="1052" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">占用成立</text><polyline points="1300,1140 470,1140" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7"/><polygon points="470,1140 483,1133 483,1146" fill="#334155"/><text x="885" y="1122" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">订单标识（待卖方确认）</text><polyline points="470,1210 170,1210" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7"/><polygon points="170,1210 183,1203 183,1216" fill="#334155"/><text x="320" y="1192" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">回执／进度／拒绝原因</text><rect x="90" y="1290" width="1330" height="180" rx="12" fill="#FFF8DC" stroke="#B45309" stroke-width="3"/><text x="755" y="1330" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="24" fill="#111827">失败、重试与并发约束</text><text x="112" y="1367" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="21" fill="#111827">失败分支：M3／M7／M9 返回拒绝时，不建立订单、不产生占用，物品状态保持（ST-B-S1）。</text><text x="112" y="1401" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="21" fill="#111827">同次重试：已有回执或处理中时返回原结果，不新增订单（ST-B-S2、BR10）。</text><text x="112" y="1435" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="21" fill="#111827">同时成立：M10—M12 中订单建立与物品占用为同一业务结果，中途失败不留下半个占用；并发下单至多一笔成立（BR06）。</text></svg>