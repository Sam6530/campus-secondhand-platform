00" height="130" rx="26" fill="#EEF2F7" stroke="#334155" stroke-width="3"/><text x="800" y="714" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="28" fill="#111827">待买方确认</text><rect x="600" y="910" width="400" height="130" rx="26" fill="#EEF2F7" stroke="#334155" stroke-width="3"/><text x="800" y="984" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="28" fill="#111827">已完成</text><rect x="60" y="380" width="340" height="130" rx="26" fill="#EEF2F7" stroke="#334155" stroke-width="3"/><text x="230" y="454" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="28" fill="#111827">已取消</text><rect x="1150" y="100" width="340" height="130" rx="26" fill="#EEF2F7" stroke="#334155" stroke-width="3"/><text x="1320" y="174" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="28" fill="#111827">已拒绝</text><rect x="1150" y="620" width="340" height="160" rx="26" fill="#EEF2F7" stroke="#334155" stroke-width="3"/><text x="1320" y="709" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="28" fill="#111827">已异常终止</text><text x="466" y="204" text-anchor="end" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">ST-B-13</text><text x="466" y="234" text-anchor="end" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">下单成立</text><text x="770" y="307" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">ST-B-14 卖方接受（BR07）</text><text x="1075" y="112" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">ST-B-15</text><text x="1075" y="142" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">卖方拒绝</text><text x="545" y="288" text-anchor="end" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">ST-B-16 普通取消</text><text x="545" y="318" text-anchor="end" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（声明未交付）</text><text x="750" y="582" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">ST-B-17 登记交付（BR08）</text><text x="410" y="532" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">ST-B-18</text><text x="410" y="562" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">取消（BR09）</text><text x="770" y="847" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">ST-B-19 买方本人确认收货（BR08）</text><text x="1075" y="732" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">ST-B-20</text><text x="1075" y="762" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">异常终止</text><text x="1096" y="497" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">ST-B-21 争议核查后异常终止（BR19）</text><text x="1096" y="527" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="22" fill="#111827">（待卖方确认阶段同适用）</text><text x="800" y="1077" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#475569">终态：无出边</text><rect x="60" y="800" width="460" height="380" rx="12" fill="#FFF8DC" stroke="#B45309" stroke-width="3"/><text x="290" y="841" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">状态保持（不产生成功转换）</text><text x="78" y="882" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">· 待卖方确认：同次重试返回原回执，不新增</text><text x="78" y="910" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">订单（BR10）。</text><text x="78" y="944" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">· 待买方确认：有登记或争议时拒绝普通取消</text><text x="78" y="972" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">，阶段保持（BR09）。</text><text x="78" y="1006" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">· 登记前确认、非本人确认、重复确认均拒绝</text><text x="78" y="1034" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">，成交不重复计数（BR08、BR18）。</text><text x="78" y="1068" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">· 四个终态：举报只追加治理记录，不重开、</text><text x="78" y="1096" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="20" fill="#111827">不改成交（BR15、BR16）。</text></svg>