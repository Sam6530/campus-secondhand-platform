nchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">4. 审核、举报、争议、隐藏与限制</text><text x="72" y="1141" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">的操作统一记为处置记录（BR16）。</text><text x="72" y="1176" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">5. 评价人、举报人以账户标识引用</text><text x="72" y="1207" text-anchor="start" font-family="SimHei,Microsoft YaHei,sans-serif" font-size="23" fill="#111827">；业务操作见正文表3-3。</text></svg>